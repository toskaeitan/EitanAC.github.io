name: Verify blog build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - run: npm install --global pnpm@11.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
